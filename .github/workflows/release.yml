name: Release

# Pushing a version tag (v<mod_version>) builds, runs every check and creates a draft
# release with the runtime JAR, sources JAR, a Git source ZIP and SHA-256 checksums.
# The draft is reviewed and published by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check tag matches mod_version
        run: |
          version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::Tag $GITHUB_REF_NAME does not match mod_version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build, check and generate module reference
        run: bash ./gradlew --no-daemon build moduleCatalog
      - name: Check committed catalogue
        run: git diff --exit-code -- MODULES.md MODULES.json
      - name: Collect assets
        run: |
          mkdir dist
          cp "build/libs/analyzer-$VERSION.jar" "build/libs/analyzer-$VERSION-sources.jar" dist/
          git archive --format=zip --prefix="Analyzer-$VERSION/" -o "dist/Analyzer-$VERSION-source.zip" HEAD
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Analyzer $VERSION" --notes "Draft created by the release workflow; notes are added before publishing."

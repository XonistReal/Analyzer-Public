    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.analyzer.automation.ScopedSettingLeaseSelfTest'
}
['combat': 'CombatPolicySelfTest', 'movement': 'MovementPolicySelfTest', 'hvh': 'HvhPolicySelfTest'].each { area, entry ->

    }
}
tasks.register('gameplayConfigCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.analyzer.core.GameplayConfigSelfTest'
}
tasks.register('privacyConfigCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.analyzer.core.PrivacyConfigSelfTest'
}
tasks.register('privacyCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.analyzer.privacy.PrivacyPolicySelfTest'
}
tasks.register('packPrivacyCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.analyzer.privacy.PackPrivacySelfTest'
}
['automationMotion': 'MotionPolicySelfTest', 'nativePathfinder': 'NativePathfinderSelfTest', 'schematic': 'SchematicSelfTest', 'retreat': 'RetreatPlannerSelfTest',
 'automationInput': 'TaskInputHandoffSelfTest', 'schematicLibrary': 'SchematicLibrarySelfTest',
 'miningRecovery': 'MiningPolicySelfTest', 'groundRecovery': 'GroundRecoveryPolicySelfTest', 'localIntent': 'LocalTaskIntentSelfTest', 'routeFollowing': 'RouteFollowingPolicySelfTest'].each { area, entry ->
    tasks.register("${area}Check", JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "dev.analyzer.automation.${entry}"
    }
}
tasks.named('check') { dependsOn tasks.named('coreCheck'), tasks.named('espCheck'), tasks.named('plannerCheck'), tasks.named('materialRecipesCheck'), tasks.named('safetyCheck'),
    tasks.named('combatCheck'), tasks.named('movementCheck'), tasks.named('hvhCheck'), tasks.named('gameplayConfigCheck'), tasks.named('privacyConfigCheck'), tasks.named('privacyCheck'), tasks.named('packPrivacyCheck'),
    tasks.named('automationMotionCheck'), tasks.named('nativePathfinderCheck'), tasks.named('schematicCheck'), tasks.named('retreatCheck'),
    tasks.named('automationInputCheck'), tasks.named('schematicLibraryCheck'), tasks.named('miningRecoveryCheck'), tasks.named('groundRecoveryCheck'), tasks.named('localIntentCheck'), tasks.named('routeFollowingCheck'), tasks.named('xrayCheck') }

tasks.register('xrayCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.analyzer.render.XrayPolicySelfTest'
}
tasks.register('moduleCatalog', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.analyzer.core.ModuleCatalog'
    args file('MODULES.json').absolutePath, file('MODULES.md').absolutePath
}

// Publish a checked build for the Prism instance's local pre-launch updater.
// Artifacts are immutable; replacing release.json is the final commit step.
tasks.register('publishLocal') {
    dependsOn tasks.named('build')
    group = 'distribution'
    description = 'Build, verify and publish Analyzer to the local Prism update feed.'
    doLast {
        if (project.minecraft_version.toString() != '1.21.4') {
            throw new GradleException('The current Prism updater supports Minecraft 1.21.4; update it before publishing another game version.')
        }
        def source = tasks.named('remapJar').get().archiveFile.get().asFile.toPath()
        def feed = file(findProperty('analyzerUpdateDir') ?: '../analyzer-updates').toPath()
        java.nio.file.Files.createDirectories(feed)
        def bytes = java.nio.file.Files.readAllBytes(source)
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
        def artifact = "analyzer-${project.version}-${digest.take(12)}.jar"
        def target = feed.resolve(artifact)
        def staging = feed.resolve(".${artifact}-${UUID.randomUUID()}.tmp")
        java.nio.file.Files.write(staging, bytes)
        java.nio.file.Files.move(staging, target,
            java.nio.file.StandardCopyOption.ATOMIC_MOVE,
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def manifest = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            schemaVersion: 1,
            modId: 'analyzer',
            minecraftVersion: project.minecraft_version.toString(),
            version: project.version.toString(),
            artifact: artifact,
            sha256: digest,
            retireLegacyBaritone: true
        ])) + '\n'
        def pending = feed.resolve(".release-${UUID.randomUUID()}.json.tmp")
        java.nio.file.Files.writeString(pending, manifest, java.nio.charset.StandardCharsets.UTF_8)
        java.nio.file.Files.move(pending, feed.resolve('release.json'),
            java.nio.file.StandardCopyOption.ATOMIC_MOVE,
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("Published Analyzer ${project.version}: ${feed.resolve('release.json').toAbsolutePath()}")
    }
}

loom {
    runs {
        nativeAutomationSmoke {
            client()
            name 'Analyzer original automation acceptance'
            runDir 'run-native-automation'
            vmArg '-Danalyzer.smoke=true'
            vmArg '-Danalyzer.worldsmoke=true'
            vmArg '-Danalyzer.nativeAutomationSmoke=true'
            if (project.findProperty('analyzerNativeScenario')) vmArg "-Danalyzer.nativeScenario=${project.findProperty('analyzerNativeScenario')}"
            programArg '--username'
            programArg 'AnalyzerDev'
            programArg '--width'
            programArg '1280'
            programArg '--height'
            programArg '800'
        }
        client {
            vmArg '-Danalyzer.dev=true'
            programArg '--username'
            programArg 'AnalyzerDev'
        }
        smoke {
            client()
            name 'Analyzer UI smoke test'
            vmArg '-Danalyzer.smoke=true'
            vmArg '-Danalyzer.worldsmoke=true'
            vmArg '-Danalyzer.automationSmoke=true'
            if (project.findProperty('analyzerBotOnly') == 'true') vmArg '-Danalyzer.botOnly=true'
            if (project.findProperty('analyzerSafetyOnly') == 'true') {
                vmArg '-Danalyzer.botOnly=true'
                vmArg '-Danalyzer.safetyOnly=true'
            }
            if (project.findProperty('analyzerTerrainOnly') == 'true') {
                vmArg '-Danalyzer.botOnly=true'

plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
    from('FONT-LICENSE.txt')
    from('THIRD-PARTY.md')
}

tasks.register('coreCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.analyzer.core.CoreSelfTest'
}
tasks.named('check') { dependsOn tasks.named('coreCheck') }

loom {
    runs {
        client {
            vmArg '-Danalyzer.dev=true'
            programArg '--username'
            programArg 'AnalyzerDev'
        }
        smoke {
            client()
            name 'Analyzer UI smoke test'
            vmArg '-Danalyzer.smoke=true'
            vmArg '-Danalyzer.worldsmoke=true'
            programArg '--username'
            programArg 'AnalyzerDev'
            programArg '--width'
            programArg '1600'
            programArg '--height'
            programArg '1000'
        }
    }
}

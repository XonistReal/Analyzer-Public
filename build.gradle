// Recovered build scaffold; original main source/resources are unchanged.
plugins { id 'fabric-loom' version '1.9.2'; id 'maven-publish' }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly files("third-party/baritone/baritone-api-fabric-1.13.1.jar")
    modRuntimeOnly files("third-party/baritone/baritone-api-fabric-1.13.1.jar")
    modRuntimeOnly files(zipTree(file("third-party/baritone/baritone-api-fabric-1.13.1.jar")).matching {
        include "META-INF/jars/nether-pathfinder-1.4.1.jar"
    })
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
    ['FONT-LICENSE.txt', 'LATO-OFL.txt', 'THIRD-PARTY.md'].each { notice -> if (file(notice).exists()) from(notice) }
}
loom { runs { client { vmArg '-Danalyzer.dev=true'; programArg '--username'; programArg 'AnalyzerDev' } } }
